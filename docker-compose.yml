version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinex_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sentinex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinex} -d ${POSTGRES_DB:-sentinex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinex_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinex}:${POSTGRES_PASSWORD:-sentinex_secure_pass}@postgres:5432/${POSTGRES_DB:-sentinex}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-sentinex-production-secret-change-me}
      - APP_ENV=production
      - DEBUG=false
      - EVIDENCE_ROOT=/app/evidence_store
      - BACKUP_DIR=/app/backups
    volumes:
      - evidence_storage:/app/evidence_store
      - backup_storage:/app/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinex_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  evidence_storage:
  backup_storage:
